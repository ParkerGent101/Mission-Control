const realFetch = window.fetch.bind(window);
window.fetch = (url, opts) => {

  if (opts && opts.method && opts.method !== 'GET') {
    console.log('[harness] swallowed', opts.method, path, opts.body);
    return Promise.resolve(new Response(JSON.stringify({ ok: true }), { headers: { 'Content-Type': 'application/json' } }));
  }
  const body = FIXTURES[path];
  if (body === undefined) {
    console.warn('[harness] no fixture for', path);
    return Promise.resolve(new Response(JSON.stringify({ error: 'no fixture' }), { status: 404, headers: { 'Content-Type': 'application/json' } }));
